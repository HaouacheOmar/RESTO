# Whole stack: docker compose up --build  →  http://localhost:8088
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: resto
      POSTGRES_USER: resto
      POSTGRES_PASSWORD: resto
    ports: ["5434:5432"]  # also used when running Django outside Docker
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  backend:
    build: ./server
    environment:
      DEBUG: "1"  # local stack over plain HTTP; production settings are in server/.env.example
      SECRET_KEY: local-docker-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py seed_demo
      && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes: [media:/app/media]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./client
    ports: ["8088:80"]
    depends_on: [backend]

volumes:
  pgdata:
  media:
