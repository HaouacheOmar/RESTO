name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: resto
          POSTGRES_USER: resto
          POSTGRES_PASSWORD: resto
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt import-linter
      - name: Module boundaries (only through each module's api.py)
        run: lint-imports
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - run: python manage.py test

  # the vision worker's logic (posture, zones, smoothing, blur, tickets). no model or pytorch needed:
  # the tests replace yolo and deepsort with fakes, so this job stays light and fast.
  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4 opencv-python-headless==5.0.0.93 fastapi==0.162.0 httpx==0.28.1 pytest==9.2.0
      - run: python -m pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build  # tsc -b (type check) + vite build

  # A throwaway staging: the whole Docker stack (nginx, Daphne, PostgreSQL, Redis, demo data), then the
  # Playwright journeys across the role spaces. Also proves the images build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
        env:
          RATE_LIMIT_SCALE: "100"  # one IP plays all nine roles
      - name: Wait until it answers
        run: timeout 180 sh -c 'until curl -sf http://localhost:8088/healthz/ | grep -q database; do sleep 3; done'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: API logs
        if: failure()
        run: docker compose logs backend --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
