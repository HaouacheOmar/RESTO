# the vision worker on an nvidia gpu (smooth video: about 25 images per second instead of about 8 on a cpu):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile vision up --build
# needs the nvidia driver (and, on linux, the nvidia container toolkit; docker desktop on windows has it).
services:
  vision-salle:
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu132
        TORCH_VERSION: 2.14.1
        TORCHVISION_VERSION: 0.29.1
    environment:
      DEVICE: cuda:0
      ANALYSIS_FPS: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
