server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;  # dish photos

    # Everything on one origin: the app never needs to know where the API lives.
    location ~ ^/(api|admin|static|media|healthz)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the blurred camera streams (docker compose --profile vision). one worker per camera, named
    # vision-<camera slug>: /stream/salle/mjpeg goes to http://vision-salle:8090/salle/mjpeg.
    # docker's dns is asked at request time, so nginx still starts when a worker is not running.
    location ~ ^/stream/(?<camera>[a-z0-9-]+)/(?<rest>.*)$ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://vision-$camera:8090/$camera/$rest$is_args$args;
        proxy_buffering off;  # mjpeg: send each image as soon as it arrives
        proxy_read_timeout 1h;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;  # client-side routes
    }
}
