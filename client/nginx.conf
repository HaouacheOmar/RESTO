server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 10m;  # dish photos

    # Everything on one origin: the app never needs to know where the API lives.
    location ~ ^/(api|admin|static|media|healthz)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # the blurred camera stream of the vision worker (docker compose --profile vision).
    # docker's dns is asked at request time, so nginx still starts when the worker is not running.
    location /stream/ {
        resolver 127.0.0.11 valid=10s;
        set $vision http://vision:8090;
        rewrite ^/stream/(.*)$ /$1 break;
        proxy_pass $vision;
        proxy_buffering off;  # mjpeg: send each image as soon as it arrives
        proxy_read_timeout 1h;
    }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;  # client-side routes
    }
}
